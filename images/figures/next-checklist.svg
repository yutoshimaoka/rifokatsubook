<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img" aria-labelledby="nc-title nc-desc">
  <title id="nc-title">次に確認することの流れ</title>
  <desc id="nc-desc">3ステップのイラスト。手元の書類を確認（保証書、過去の見積書、写真記録）、業者に確認（見積書の内訳、調査報告書、リフォーム瑕疵保険の加入有無）、公的窓口に相談（消費者ホットライン188、住まいるダイヤル）。</desc>
  <style>
    .card { fill: #fff; stroke: #4a3a33; stroke-width: 2.2; }
    .ln { fill: none; stroke: #4a3a33; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .thin { fill: none; stroke: #4a3a33; stroke-width: 1.4; stroke-linecap: round; opacity: .4; }
    .step { fill: #3e7f7a; }
    .step-t { fill: #fff; font: 700 14px "Noto Sans JP", sans-serif; text-anchor: middle; }
    .ttl { fill: #4a3a33; font: 700 15px "Noto Sans JP", sans-serif; text-anchor: middle; }
    .item { fill: #857a6e; font: 500 12.5px "Noto Sans JP", sans-serif; text-anchor: middle; }
    .arrow { fill: none; stroke: #4a3a33; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; opacity: .6; }
  </style>
  <rect width="760" height="340" fill="#efe9de" rx="12"/>

  <!-- STEP 1 -->
  <rect class="card" x="34" y="60" width="204" height="212" rx="10"/>
  <circle class="step" cx="136" cy="60" r="18"/><text class="step-t" x="136" y="65">1</text>
  <rect class="card" x="106" y="96" width="60" height="56" rx="4"/>
  <path class="thin" d="M118 114h36M118 128h36M118 142h22"/>
  <text class="ttl" x="136" y="188">手元の書類を確認</text>
  <text class="item" x="136" y="214">保証書・引き渡し書類</text>
  <text class="item" x="136" y="234">過去の見積書と請求書</text>
  <text class="item" x="136" y="254">室内・外部の写真記録</text>

  <path class="arrow" d="M256 166h34m0 0-10-8m10 8-10 8"/>

  <!-- STEP 2 -->
  <rect class="card" x="308" y="60" width="204" height="212" rx="10"/>
  <circle class="step" cx="410" cy="60" r="18"/><text class="step-t" x="410" y="65">2</text>
  <path class="ln" d="M392 100a18 18 0 1 1 0 36 18 18 0 0 1 0-36" transform="translate(0,-2)"/>
  <path class="ln" d="M416 132l14 16"/>
  <text class="ttl" x="410" y="188">業者に確認</text>
  <text class="item" x="410" y="214">見積書の内訳</text>
  <text class="item" x="410" y="234">写真付きの調査報告書</text>
  <text class="item" x="410" y="254">リフォーム瑕疵保険の加入</text>

  <path class="arrow" d="M530 166h34m0 0-10-8m10 8-10 8"/>

  <!-- STEP 3 -->
  <rect class="card" x="582" y="60" width="144" height="212" rx="10"/>
  <circle class="step" cx="654" cy="60" r="18"/><text class="step-t" x="654" y="65">3</text>
  <path class="ln" d="M636 100h36v28h-14l-8 10-4-10h-10z"/>
  <text class="ttl" x="654" y="188">公的窓口に相談</text>
  <text class="item" x="654" y="214">消費者ホットライン</text>
  <text class="item" x="654" y="234">188</text>
  <text class="item" x="654" y="258">住まいるダイヤル</text>
</svg>
